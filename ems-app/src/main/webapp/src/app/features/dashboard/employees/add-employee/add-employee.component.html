<div class="container">
  <h2>Add Employee</h2>
  <form (ngSubmit)="save()" #employeeForm="ngForm">
    <div class="form-group">
      <label>Employee Number</label>
      <input name="empNo" [(ngModel)]="employee.empNo" class="form-control" />
    </div>
    <div class="form-group">
      <label>First Name</label>
      <input name="firstName" [(ngModel)]="employee.firstName" class="form-control" required />
    </div>
    <div class="form-group">
      <label>Last Name</label>
      <input name="lastName" [(ngModel)]="employee.lastName" class="form-control" required />
    </div>
    <div class="form-group">
      <label>Birth Date</label>
      <input name="birthDate" [(ngModel)]="employee.birthDate" type="date" class="form-control" />
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <button class="btn btn-secondary" type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
