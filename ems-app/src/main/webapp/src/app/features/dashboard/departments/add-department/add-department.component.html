<div class="container">
  <h2>Add Department</h2>
  <form (ngSubmit)="save()" #deptForm="ngForm">
    <div class="form-group">
      <label>Department Number</label>
      <input name="deptNo" [(ngModel)]="department.deptNo" class="form-control" />
    </div>
    <div class="form-group">
      <label>Department Name</label>
      <input name="deptName" [(ngModel)]="department.deptName" class="form-control" required />
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <button class="btn btn-secondary" type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
