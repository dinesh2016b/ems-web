<div class="page-container">
  <!-- Header Section -->
  <div class="page-header">
    <div class="header-content">
      <div class="header-left">
        <i class="fas fa-sitemap header-icon"></i>
        <div>
          <h1 class="page-title">Department Management</h1>
          <p class="page-subtitle">Organize and manage company departments</p>
        </div>
      </div>
      <button class="btn-add-new" (click)="onAddDepartment()">
        <i class="fas fa-plus"></i>
        Add Department
      </button>
    </div>
  </div>

  <!-- Search & Filter Section -->
  <div class="filter-section">
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input type="text" placeholder="Search departments by name..." class="search-input">
    </div>
    <div class="filter-controls">
      <select class="filter-select">
        <option>All Status</option>
        <option>Active</option>
        <option>Inactive</option>
      </select>
    </div>
  </div>

  <!-- Departments Grid -->
  <div class="departments-grid">
    <div class="dept-card" *ngFor="let department of departments">
      <div class="card-header">
        <div class="dept-icon">
          <i class="fas fa-building"></i>
        </div>
        <div class="card-actions">
          <button class="action-btn" (click)="editDepartment(department)" title="Edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="action-btn delete" (click)="removeDepartment(department)" title="Delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
      <div class="card-body">
        <h3 class="dept-name">{{ department.deptName }}</h3>
        <div class="dept-info">
          <div class="info-row">
            <span class="info-label">Department ID:</span>
            <span class="info-value">{{ department.deptNo }}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Status:</span>
            <span class="badge badge-active">Active</span>
          </div>
          <div class="employee-count">
            <i class="fas fa-users"></i>
            <span>12 Employees</span>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-view-employees" (click)="viewDepartmentDetails(department)">
          View Employees
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!departments || departments.length === 0">
    <i class="fas fa-inbox"></i>
    <h3>No Departments Found</h3>
    <p>Create a new department to get started</p>
    <button class="btn-add-new" (click)="onAddDepartment()">
      <i class="fas fa-plus"></i>
      Create Department
    </button>
  </div>
</div>
