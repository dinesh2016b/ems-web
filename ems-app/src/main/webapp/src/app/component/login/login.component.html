<div class="auth-container">
  <!-- Background Design -->
  <div class="auth-bg">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="auth-wrapper">
    <!-- Logo/Brand Section -->
    <div class="auth-brand">
      <div class="brand-icon">
        <i class="fas fa-lock"></i>
      </div>
      <h1 class="brand-name">Employee Management System</h1>
    </div>

    <!-- Login Card -->
    <div class="auth-card">
      <div class="card-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your account to continue</p>
      </div>

      <form [formGroup]="loginForm" class="auth-form" (ngSubmit)="onSubmit()" autocomplete="on" novalidate>
        <!-- Username/Email Field -->
        <div class="form-group">
          <label for="username" class="form-label">
            <i class="fas fa-user"></i>
            Username or Email
          </label>
          <div class="input-wrapper">
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="Enter your username or email"
              formControlName="userName"
              autocomplete="username"
              autocapitalize="none"
              [attr.aria-invalid]="loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched"
              aria-describedby="username-error">
            <i class="fas fa-envelope input-icon"></i>
          </div>
          <small
            id="username-error"
            class="form-error"
            *ngIf="loginForm.get('userName')?.hasError('required') && loginForm.get('userName')?.touched">
            Enter your username or email.
          </small>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">
            <i class="fas fa-lock"></i>
            Password
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter your password"
              formControlName="password"
              autocomplete="current-password"
              [attr.aria-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              aria-describedby="password-error">
            <i class="fas fa-key input-icon"></i>
          </div>
          <small
            id="password-error"
            class="form-error"
            *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
            Enter your password.
          </small>
          <small
            class="form-error"
            *ngIf="loginForm.get('password')?.hasError('minlength') && loginForm.get('password')?.touched">
            Password must be at least 6 characters.
          </small>
        </div>

        <div class="login-error" role="alert" *ngIf="loginError">{{ loginError }}</div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn-submit"
          [disabled]="isSubmitting">
          <i class="fas" [ngClass]="isSubmitting ? 'fa-spinner fa-spin' : 'fa-sign-in-alt'"></i>
          {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
        </button>
      </form>

      <!-- Signup Link -->
      <div class="auth-footer">
        <p>Don't have an account? 
          <a routerLink="/ems-signup" class="signup-link">Create one now</a>
        </p>
      </div>
    </div>

  </div>
</div>
