<div class="modal-header">
  <div>
    <h2 class="modal-title" id="employee-details-title">Employee Details</h2>
    <p class="modal-subtitle" *ngIf="employee">
      {{ employee.firstName }} {{ employee.lastName }}
    </p>
  </div>
  <button
    *ngIf="activeModal"
    type="button"
    class="btn-close"
    aria-label="Close employee details"
    (click)="closeMe()">
  </button>
</div>

<div class="modal-body" *ngIf="employee; else loadingEmployee">
  <dl class="employee-details">
    <div class="detail-row">
      <dt>Employee ID</dt>
      <dd>{{ employee.empNo }}</dd>
    </div>
    <div class="detail-row">
      <dt>First name</dt>
      <dd>{{ employee.firstName }}</dd>
    </div>
    <div class="detail-row">
      <dt>Last name</dt>
      <dd>{{ employee.lastName }}</dd>
    </div>
    <div class="detail-row">
      <dt>Birth date</dt>
      <dd>{{ employee.birthDate | date:"MMM d, yyyy" }}</dd>
    </div>
  </dl>
</div>

<ng-template #loadingEmployee>
  <div class="modal-body">Loading employee details...</div>
</ng-template>

<div class="modal-footer" *ngIf="activeModal">
  <button type="button" class="btn btn-secondary" (click)="closeMe()">Close</button>
</div>
